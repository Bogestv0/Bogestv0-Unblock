name: Update IP list

on:
  schedule:
    - cron: '17 */12 * * *'   # дважды в сутки
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve Discord / YouTube domains
        run: python3 .github/scripts/gen_ipset.py

      - name: Commit if changed
        run: |
          if [ -n "$(git status --porcelain lists/ipset.txt)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add lists/ipset.txt
            git commit -m "Обновление списка IP"
            git push
          else
            echo "Без изменений"
          fi
