name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Build installer
        run: bash build.sh

      - name: Checksum
        run: cd dist && sha256sum Bogestv0-Unblock-Setup.exe > SHA256SUMS.txt && cat SHA256SUMS.txt

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/Bogestv0-Unblock-Setup.exe
            dist/SHA256SUMS.txt
          generate_release_notes: true

      - name: Keep artifact (manual runs)
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v4
        with:
          name: Bogestv0-Unblock-Setup
          path: dist/*
